name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ── 1. Export Real-ESRGAN weights → ONNX (cached; only re-runs if the script changes) ──
      - name: Cache ONNX models
        id: models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: onnx-models-${{ hashFiles('tools/export_models.py', 'tools/requirements.txt') }}

      - uses: actions/setup-python@v5
        if: steps.models.outputs.cache-hit != 'true'
        with:
          python-version: '3.11'

      - name: Export models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install --quiet onnx==1.17.0 onnxruntime==1.20.1 "numpy<2"
          pip install --quiet onnxsim==0.4.36 || echo "onnxsim unavailable, skipping simplification"
          python tools/export_models.py app/src/main/assets/models
          ls -la app/src/main/assets/models

      # ── 2. Build Android ──
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK at $ANDROID_HOME; accept licenses so Gradle can auto-download platforms/build-tools
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Decode release keystore (if configured)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Rename APK
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT="VideoUpscalerAI-v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)-${GITHUB_SHA::7}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: VideoUpscalerAI-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      # ── 3. Publish a GitHub Release on every push to main so the APK has a permanent download link ──
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Video Upscaler AI — build ${{ github.run_number }}
          body: |
            📱 **حمّل ملف الـ APK من الأسفل وسطّبه على موبايلك (Android 8.0+)**

            Commit: ${{ github.sha }}
            Models: Real-ESRGAN general-x4v3 / general-wdn-x4v3 / animevideov3 (ONNX, on-device)
          files: ${{ steps.apk.outputs.path }}
          prerelease: false
